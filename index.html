<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng tài xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <span class="brand-mark">🚌</span>
      <div>
        <div class="brand-name">Bảng tài xe</div>
        <div class="brand-sub">Dữ liệu trực tiếp từ hệ thống</div>
      </div>
    </div>

    <section class="panel">
      <h2>Chọn dữ liệu</h2>
      <label for="route">Tuyến</label>
      <select id="route"><option>Đang tải tuyến...</option></select>
      <label for="date">Ngày</label>
      <input type="date" id="date">
      <label for="nguoiDo">Người đo nồng độ cồn</label>
      <input type="text" id="nguoiDo" value="Nguyễn Hoài Nam">
    </section>

    <section class="panel">
      <h2>Tác vụ</h2>
      <button id="btnLoad" class="task">
        <span class="task-ico">🚐</span>
        <span><span class="task-title">Tải bảng xe</span><span class="task-desc">Giờ điều xe, giờ đi, cảnh báo, mất chuyến</span></span>
      </button>
      <button id="btnEbms" class="task">
        <span class="task-ico">📊</span>
        <span><span class="task-title">So sánh EBMS</span><span class="task-desc">Đối chiếu phân công với EBMS</span></span>
      </button>
      <button id="btnNv" class="task">
        <span class="task-ico">👥</span>
        <span><span class="task-title">Trích xuất nhân viên</span><span class="task-desc">Danh sách tài xế, tiếp viên để đo cồn</span></span>
      </button>
    </section>

    <button id="btnKey" class="side-link">🔑 Đổi mã truy cập</button>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="search"><span aria-hidden="true">🔍</span><input type="text" id="q" placeholder="Lọc theo xe, tên, bến..."></div>
      <label class="check"><input type="checkbox" id="onlyWarn"> Chỉ hiện dòng cảnh báo hoặc lệch</label>
      <button class="btn-soft" id="btnCopy" style="display:none">📋 Copy bảng để dán vào Sheet</button>
    </div>

    <div id="msg"></div>

    <div class="legend">
      <span class="lg lg-y">Vàng: lệch 5 phút</span>
      <span class="lg lg-r">Đỏ: điều xe trễ, hoặc lệch từ 6 phút</span>
      <span class="lg lg-g">Xanh lá: giờ đi khác lịch chạy</span>
      <span class="lg lg-p">Tím viền cam: trùng giờ chuyến liền kề</span>
    </div>

    <div class="stats" id="stats"></div>
    <div class="wrap" id="out"></div>
  </main>

</div>
<script src="app.js"></script>
</body>
</html>
