<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>Hermes Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#0F172A',
                        card: '#1E293B',
                        border: '#334155',
                        accent: '#38BDF8'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-bg text-slate-200 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-card border-b border-border px-6 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-accent p-2 rounded-lg text-bg font-bold text-lg">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Hermes</h1>
                <p class="text-[11px] text-gray-500">Web Chat Client</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="status" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-red-500/20 text-red-400 border border-red-500/30">
                <i class="fa-solid fa-circle-dot mr-1"></i> Chưa kết nối
            </span>
            <input id="api-url" type="text" value="https://HERMES_TUNNEL_URL_HERE/v1"
                class="bg-bg border border-border rounded px-3 py-1 text-xs w-64 focus:outline-none focus:border-accent transition-colors font-mono"
                placeholder="Hermes API URL...">
        </div>
    </header>

    <!-- Chat -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="messages" class="flex-1 p-6 overflow-y-auto space-y-4">
            <!-- Welcome -->
            <div class="text-center my-auto">
                <div class="text-4xl text-accent mb-3"><i class="fa-solid fa-terminal animate-pulse"></i></div>
                <p class="text-sm text-gray-400">Nhấn Ping để kiểm tra kết nối, rồi nhắn gì đó.</p>
                <button onclick="ping()" class="mt-4 bg-accent hover:bg-sky-400 text-bg font-bold py-2 px-5 rounded text-sm transition-colors">
                    <i class="fa-solid fa-plug mr-2"></i> Ping
                </button>
            </div>
        </div>

        <!-- Input -->
        <div class="p-4 border-t border-border bg-card">
            <div class="max-w-4xl mx-auto flex items-end space-x-3">
                <div class="flex-1 bg-bg border border-border rounded-lg focus-within:border-accent transition-colors">
                    <textarea id="input" rows="1" placeholder="Nhập tin nhắn..."
                        class="w-full bg-transparent border-0 rounded-lg px-4 py-3 text-sm focus:outline-none resize-none max-h-40 min-h-[44px]"
                        onkeydown="onKey(event)" oninput="grow(this)"></textarea>
                </div>
                <button onclick="send()" class="bg-accent hover:bg-sky-400 text-bg font-bold p-3.5 rounded-lg transition-colors">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <div class="max-w-4xl mx-auto mt-1 text-[11px] text-gray-600 px-1">
                Enter gửi · Shift+Enter xuống dòng
            </div>
        </div>
    </main>

<script>
const $ = id => document.getElementById(id);

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function nl2br(s) {
    return esc(s).replace(/\n/g, '<br>');
}

function grow(el) {
    el.style.height = '1px';
    el.style.height = el.scrollHeight + 'px';
}

function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function bubble(role, html) {
    const wrap = document.createElement('div');
    if (role === 'user') {
        wrap.className = 'flex justify-end';
        wrap.innerHTML = `<div class="max-w-[70%] bg-accent text-bg rounded-2xl rounded-tr-none px-4 py-3 text-sm font-medium">${html}</div>`;
    } else {
        wrap.className = 'flex justify-start items-start space-x-3';
        wrap.innerHTML = `
            <div class="bg-accent p-2 rounded-lg text-bg text-xs mt-0.5"><i class="fa-solid fa-robot"></i></div>
            <div class="max-w-[75%] bg-card border border-border rounded-2xl rounded-tl-none px-5 py-4 text-sm leading-relaxed">
                <div class="content-text">${html}</div>
            </div>`;
    }
    $('messages').appendChild(wrap);
    $('messages').scrollTop = $('messages').scrollHeight;
    return wrap.querySelector('.content-text');
}

function rmWelcome() {
    const w = $('messages').querySelector('.text-center');
    if (w) w.remove();
}

function setStatus(ok) {
    const el = $('status');
    if (ok) {
        el.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        el.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Đã kết nối';
    } else {
        el.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-red-500/20 text-red-400 border border-red-500/30';
        el.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i> Chưa kết nối';
    }
}

function baseUrl() {
    let u = $('api-url').value.trim();
    return u.endsWith('/') ? u.slice(0, -1) : u;
}

async function ping() {
    const el = $('status');
    el.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/30';
    el.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Đang kết nối...';
    try {
        const r = await fetch(`${baseUrl()}/models`);
        if (r.ok) { setStatus(true); return true; }
        throw new Error(`HTTP ${r.status}`);
    } catch (e) {
        setStatus(false);
        bubble('assistant', `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Không kết nối được: ${esc(e.message)}</span>`);
        return false;
    }
}

function fmt(text) {
    return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.+?)\*/g, '<i>$1</i>')
        .replace(/`([^`]+)`/g, '<code class="bg-slate-900 border border-border px-1.5 py-0.5 rounded text-xs text-accent">$1</code>')
        .replace(/```[\w]*\n([\s\S]*?)```/g, '<pre class="bg-slate-950 border border-border p-3 rounded-lg my-2 text-xs font-mono overflow-x-auto text-sky-400"><code>$1</code></pre>')
        .replace(/\n/g, '<br>');
}

async function send() {
    const inp = $('input');
    const msg = inp.value.trim();
    if (!msg) return;
    inp.value = '';
    inp.style.height = '44px';
    rmWelcome();

    bubble('user', nl2br(msg));
    const contentEl = bubble('assistant', '<i class="fa-solid fa-circle-notch animate-spin text-accent"></i>');

    try {
        const r = await fetch(`${baseUrl()}/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'hermes-agent',
                messages: [{ role: 'user', content: msg }],
                stream: true
            })
        });

        if (!r.ok) throw new Error(`HTTP ${r.status}`);

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });

            // Try to extract complete text from stream
            // Accumulate all delta content for formatting
            let text = '';
            for (const line of buf.split('\n')) {
                const t = line.trim();
                if (!t || t === 'data: [DONE]' || !t.startsWith('data: ')) continue;
                try {
                    const d = JSON.parse(t.slice(6));
                    text += d.choices[0].delta.content || '';
                } catch(e) {}
            }
            contentEl.innerHTML = fmt(text);
            $('messages').scrollTop = $('messages').scrollHeight;
        }
    } catch (e) {
        contentEl.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${esc(e.message)}</span>`;
    }
}
</script>
</body>
</html>
